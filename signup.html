
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Student Book Exchange</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="signup-page">

    <!-- Navigation Bar -->
    <nav class="navbar bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                📚 Student Book Exchange
            </a>

            <a href="index.html" class="btn btn-outline-primary">
                Back to Home
            </a>
        </div>
    </nav>

    <!-- Signup Section -->
    <section class="signup-section">
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-md-8 col-lg-6">

                    <div class="signup-card">

                        <div class="text-center mb-4">
                            <div class="signup-icon">🎓</div>

                            <h2 class="fw-bold mt-3">
                                Create Your Account
                            </h2>

                            <p class="text-secondary">
                                Join the student book exchange community.
                            </p>
                        </div>

                        <!-- Signup Form -->
                        <form action="#" method="post">

                            <div class="mb-3">
                                <label for="fullName" class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="fullName"
                                    name="fullName"
                                    placeholder="Enter your full name"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="university" class="form-label">
                                    University / College
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="university"
                                    name="university"
                                    placeholder="Enter your institution"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Create a password"
                                    minlength="8"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Re-enter your password"
                                    minlength="8"
                                    required>
                            </div>

                            <div class="form-check mb-4">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms"
                                    required>

                                <label class="form-check-label" for="terms">
                                    I agree to the terms and conditions.
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                Create Account
                            </button>

                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">
                                Already have an account?

                                <a href="login.html" class="text-primary fw-bold text-decoration-none">
                                    Login
                                </a>
                            </p>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0 small">
            © 2026 Student Book Exchange. All rights reserved.
        </p>
    </footer>

</body>
</html>
